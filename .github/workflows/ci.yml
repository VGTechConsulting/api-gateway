# CI. Third-party actions and images are pinned by commit SHA or
# digest, never by a movable tag, following the article's supply-chain advice.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
      - name: Install locked dependencies
        run: uv sync --frozen --python 3.12
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy --strict gate
      - name: Layer contracts
        run: uv run lint-imports
      - name: Tests
        run: uv run pytest -q
      - name: No copyleft runtime dependencies
        run: |
          uv sync --frozen --python 3.12 --no-dev
          uv pip install pip-licenses
          uv run --no-sync pip-licenses --partial-match --fail-on "GPL;AGPL;LGPL" \
            --ignore-packages pip-licenses prettytable wcwidth

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --verbose

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build runtime and bench images
        run: |
          docker build -t "api-gateway:${GITHUB_SHA}" .
          docker build --target bench -t "api-gateway-bench:${GITHUB_SHA}" .
      - name: Placeholder prices must fail check-config
        run: |
          if docker run --rm -e ANTHROPIC_API_KEY=x -e DEEPSEEK_API_KEY=x \
              -v "$PWD/config.example.yaml:/etc/api-gateway/config.yaml:ro" \
              "api-gateway:${GITHUB_SHA}" check-config; then
            echo "config.example.yaml unexpectedly passed check-config" && exit 1
          fi
