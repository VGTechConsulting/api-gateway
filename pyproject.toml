[project]
name = "api-gateway"
version = "0.1.0"
description = "A lightweight AI gateway for LLM traffic: the reference implementation for 'API gates: controlling AI consumption in the enterprise'."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "VG Tech Consulting" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
api-gateway = "gate.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.0",
    "types-PyYAML>=6.0",
    "pip-licenses>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gate"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["gate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
