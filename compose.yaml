services:
  api-gateway:
    build: .
    image: api-gateway:0.1.0
    command: ["serve"]
    # Loopback only: the gate is not reachable from the network. Set API_GATEWAY_HOST_PORT in
    # .env to publish on another host port; the container always listens on 8787.
    ports: ["127.0.0.1:${API_GATEWAY_HOST_PORT:-8787}:8787"]
    env_file: .env
    environment:
      API_GATEWAY_CONFIG: /etc/api-gateway/config.yaml
      API_GATEWAY_HOST: 0.0.0.0
      API_GATEWAY_DB: /data/api-gateway.db
      API_GATEWAY_REQUEST_LOG: stdout
    volumes:
      - ./config.yaml:/etc/api-gateway/config.yaml:ro
      - api-gateway-data:/data
    read_only: true
    tmpfs: [/tmp]
    stop_grace_period: 30s
    restart: unless-stopped
    # One replica only: rate windows and reservations live in process memory. Never --scale.

  api-gateway-ui:             # read-only report UI: http://localhost:8789
    image: api-gateway:0.1.0  # same image as the gate, built by the service above
    command: ["ui"]
    # Loopback only and unauthenticated by design: never publish it on a network interface.
    # Set API_GATEWAY_UI_HOST_PORT in .env to use another host port.
    ports: ["127.0.0.1:${API_GATEWAY_UI_HOST_PORT:-8789}:8789"]
    # No env_file: no provider keys enter this container.
    environment:
      API_GATEWAY_CONFIG: /etc/api-gateway/config.yaml
      API_GATEWAY_UI_HOST: 0.0.0.0
      API_GATEWAY_DB: /data/api-gateway.db
    volumes:
      - ./config.yaml:/etc/api-gateway/config.yaml:ro
      - api-gateway-data:/data  # WAL readers need the -shm file; the DB is opened mode=ro
    depends_on:
      api-gateway: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8789/healthz', timeout=2)"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped

  mock-upstream:              # benchmarks: docker compose --profile bench up
    build: {context: ., target: bench}
    image: api-gateway-bench:0.1.0
    entrypoint: ["python", "-m", "bench.mock_upstream"]
    command: ["--port", "9999"]
    read_only: true
    profiles: [bench]

  # Optional: local model; set the deployment's base_url to http://ollama:11434
  # ollama:
  #   image: ollama/ollama:<pinned version>
  #   volumes: [ollama-models:/root/.ollama]

volumes:
  api-gateway-data:
